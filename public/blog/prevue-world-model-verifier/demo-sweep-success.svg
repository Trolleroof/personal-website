<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" role="img" aria-label="8-scene grasp-miss sweep success rates">
  <rect width="560" height="320" fill="#fff"/>
  <text x="280" y="28" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="14" font-weight="600" fill="#333">8-scene grasp-miss sweep  same flawed plan, same scenes</text>
  <!-- y-axis -->
  <line x1="70" y1="50" x2="70" y2="260" stroke="#ccc" stroke-width="1"/>
  <line x1="70" y1="260" x2="520" y2="260" stroke="#ccc" stroke-width="1"/>
  <text x="24" y="160" transform="rotate(-90 24 160)" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" fill="#555">Success rate (%)</text>
  <!-- grid -->
  <line x1="70" y1="210" x2="520" y2="210" stroke="#eee" stroke-width="1"/>
  <text x="62" y="214" text-anchor="end" font-family="Geist Mono, monospace" font-size="10" fill="#888">25</text>
  <line x1="70" y1="160" x2="520" y2="160" stroke="#eee" stroke-width="1"/>
  <text x="62" y="164" text-anchor="end" font-family="Geist Mono, monospace" font-size="10" fill="#888">50</text>
  <line x1="70" y1="110" x2="520" y2="110" stroke="#eee" stroke-width="1"/>
  <text x="62" y="114" text-anchor="end" font-family="Geist Mono, monospace" font-size="10" fill="#888">75</text>
  <line x1="70" y1="60" x2="520" y2="60" stroke="#eee" stroke-width="1"/>
  <text x="62" y="64" text-anchor="end" font-family="Geist Mono, monospace" font-size="10" fill="#888">100</text>
  <!-- bars: 0%, 87.5%, 75% -->
  <rect x="130" y="260" width="80" height="0" fill="#888" stroke="#333" stroke-width="0.6"/>
  <text x="170" y="252" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="11" font-weight="700" fill="#333">0/8</text>
  <text x="170" y="280" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="11" fill="#555">Unverified</text>
  <rect x="260" y="60" width="80" height="200" fill="#336699" stroke="#333" stroke-width="0.6"/>
  <text x="300" y="52" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="11" font-weight="700" fill="#333">7/8</text>
  <text x="300" y="280" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="11" fill="#555">Geometry verifier</text>
  <rect x="390" y="110" width="80" height="150" fill="#c0392b" stroke="#333" stroke-width="0.6"/>
  <text x="430" y="102" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="11" font-weight="700" fill="#333">6/8</text>
  <text x="430" y="280" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="11" fill="#555">World-model verifier</text>
</svg>
