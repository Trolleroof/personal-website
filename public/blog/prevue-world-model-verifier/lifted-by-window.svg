<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" role="img" aria-label="Lifted accuracy by rollout window">
  <rect width="560" height="320" fill="#fff"/>
  <text x="280" y="28" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="14" font-weight="600" fill="#333">Where grasp information is lost in the rollout</text>
  <line x1="70" y1="50" x2="70" y2="260" stroke="#ccc" stroke-width="1"/>
  <line x1="70" y1="260" x2="520" y2="260" stroke="#ccc" stroke-width="1"/>
  <text x="280" y="300" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" fill="#555">Rollout window</text>
  <text x="24" y="160" transform="rotate(-90 24 160)" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" fill="#555">lifted accuracy (%)</text>
  <!-- y grid 50-100 -->
  <line x1="70" y1="60" x2="520" y2="60" stroke="#eee" stroke-width="1"/>
  <text x="62" y="64" text-anchor="end" font-family="Geist Mono, monospace" font-size="10" fill="#888">100</text>
  <line x1="70" y1="110" x2="520" y2="110" stroke="#eee" stroke-width="1"/>
  <text x="62" y="114" text-anchor="end" font-family="Geist Mono, monospace" font-size="10" fill="#888">75</text>
  <line x1="70" y1="160" x2="520" y2="160" stroke="#eee" stroke-width="1"/>
  <text x="62" y="164" text-anchor="end" font-family="Geist Mono, monospace" font-size="10" fill="#888">50</text>
  <!-- close/lift marker at window 3 -->
  <line x1="262" y1="50" x2="262" y2="260" stroke="#ccc" stroke-dasharray="4 3" stroke-width="1"/>
  <text x="268" y="200" font-family="Geist, system-ui, sans-serif" font-size="10" fill="#666">close/lift</text>
  <text x="268" y="212" font-family="Geist, system-ui, sans-serif" font-size="10" fill="#666">transition</text>
  <!-- legend -->
  <circle cx="340" cy="48" r="5" fill="#c0392b"/>
  <text x="352" y="52" font-family="Geist, system-ui, sans-serif" font-size="11" fill="#333">Imagined latent</text>
  <rect x="430" y="43" width="10" height="10" fill="none" stroke="#336699" stroke-width="2"/>
  <text x="446" y="52" font-family="Geist, system-ui, sans-serif" font-size="11" fill="#333">Real latent (oracle)</text>
  <!-- imagined: 100,100,71.7,71.2,72.0 mapped y=60 at 100%, y=260 at 50% -->
  <polyline fill="none" stroke="#c0392b" stroke-width="2.5" points="130,60 190,60 250,110 310,111 370,110"/>
  <circle cx="130" cy="60" r="5" fill="#c0392b"/>
  <circle cx="190" cy="60" r="5" fill="#c0392b"/>
  <circle cx="250" cy="110" r="5" fill="#c0392b"/>
  <circle cx="310" cy="111" r="5" fill="#c0392b"/>
  <circle cx="370" cy="110" r="5" fill="#c0392b"/>
  <!-- oracle: 100,100,99.5,98.8,99.1 -->
  <polyline fill="none" stroke="#336699" stroke-width="2" stroke-dasharray="6 4" points="130,60 190,60 250,61 310,62 370,61"/>
  <rect x="125" y="55" width="10" height="10" fill="none" stroke="#336699" stroke-width="2"/>
  <rect x="185" y="55" width="10" height="10" fill="none" stroke="#336699" stroke-width="2"/>
  <rect x="245" y="56" width="10" height="10" fill="none" stroke="#336699" stroke-width="2"/>
  <rect x="305" y="57" width="10" height="10" fill="none" stroke="#336699" stroke-width="2"/>
  <rect x="365" y="56" width="10" height="10" fill="none" stroke="#336699" stroke-width="2"/>
  <!-- x labels -->
  <text x="130" y="276" text-anchor="middle" font-family="Geist Mono, monospace" font-size="10" fill="#888">1</text>
  <text x="190" y="276" text-anchor="middle" font-family="Geist Mono, monospace" font-size="10" fill="#888">2</text>
  <text x="250" y="276" text-anchor="middle" font-family="Geist Mono, monospace" font-size="10" fill="#888">3</text>
  <text x="310" y="276" text-anchor="middle" font-family="Geist Mono, monospace" font-size="10" fill="#888">4</text>
  <text x="370" y="276" text-anchor="middle" font-family="Geist Mono, monospace" font-size="10" fill="#888">5</text>
</svg>
