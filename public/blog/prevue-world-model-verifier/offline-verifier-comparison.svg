<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" role="img" aria-label="Offline world model vs plan-only control accuracy">
  <rect width="560" height="320" fill="#fff"/>
  <text x="280" y="28" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="14" font-weight="600" fill="#333">Offline compiled-plan verdicts  vision vs plan-only</text>
  <line x1="70" y1="50" x2="70" y2="260" stroke="#ccc" stroke-width="1"/>
  <line x1="70" y1="260" x2="520" y2="260" stroke="#ccc" stroke-width="1"/>
  <text x="24" y="160" transform="rotate(-90 24 160)" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" fill="#555">Test accuracy (%)</text>
  <line x1="70" y1="60" x2="520" y2="60" stroke="#eee" stroke-width="1"/>
  <text x="62" y="64" text-anchor="end" font-family="Geist Mono, monospace" font-size="10" fill="#888">100</text>
  <line x1="70" y1="110" x2="520" y2="110" stroke="#eee" stroke-width="1"/>
  <text x="62" y="114" text-anchor="end" font-family="Geist Mono, monospace" font-size="10" fill="#888">75</text>
  <!-- legend -->
  <rect x="340" y="42" width="12" height="12" fill="#c0392b"/>
  <text x="358" y="52" font-family="Geist, system-ui, sans-serif" font-size="11" fill="#333">World model</text>
  <rect x="430" y="42" width="12" height="12" fill="#336699"/>
  <text x="448" y="52" font-family="Geist, system-ui, sans-serif" font-size="11" fill="#333">Plan-only</text>
  <!-- success: wm 85.2, plan 85.5 -->
  <rect x="115" y="72" width="28" height="188" fill="#c0392b" stroke="#333" stroke-width="0.5"/>
  <rect x="147" y="70" width="28" height="190" fill="#336699" stroke="#333" stroke-width="0.5"/>
  <text x="145" y="280" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="11" fill="#555">success</text>
  <!-- in_target -->
  <rect x="255" y="72" width="28" height="188" fill="#c0392b" stroke="#333" stroke-width="0.5"/>
  <rect x="287" y="70" width="28" height="190" fill="#336699" stroke="#333" stroke-width="0.5"/>
  <text x="285" y="280" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="11" fill="#555">in_target</text>
  <!-- lifted: wm 72.0, plan 71.7 -->
  <rect x="395" y="110" width="28" height="150" fill="#c0392b" stroke="#333" stroke-width="0.5"/>
  <rect x="427" y="111" width="28" height="149" fill="#336699" stroke="#333" stroke-width="0.5"/>
  <text x="425" y="280" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="11" fill="#555">lifted</text>
</svg>
